services:
  metadata:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${STUDIO_METADATA_PASSWORD:?Set STUDIO_METADATA_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - studio-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U studio -d studio"]
      interval: 2s
      timeout: 4s
      retries: 20
    mem_limit: 384m
    cpus: 1
    security_opt:
      - no-new-privileges:true
volumes:
  studio-metadata:
